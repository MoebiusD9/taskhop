[package]
name = "taskhop"
version = "0.1.0"
description = "A small always-on-top to-do widget"
authors = ["MoebiusD9"]
license = "MIT"
repository = "https://github.com/MoebiusD9/taskhop"
edition = "2021"

[lib]
# The "_lib" suffix avoids a name clash with the binary on Windows.
name = "taskhop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
reqwest = { version = "0.13", features = ["json"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native"] }
chrono = "0.4"
iana-time-zone = "0.1"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
